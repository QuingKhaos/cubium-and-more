[mod-setting-name]
cubium-and-more-planet-discovery-prerequisites=[color=cyan][font=heading-2]Tweaks[/font][/color] Planet discovery prerequisites
cubium-and-more-science-pack-reorganization=[color=cyan][font=heading-2]Tweaks[/font][/color] Reorganize science packs

[mod-setting-description]
cubium-and-more-planet-discovery-prerequisites=Add space locations on the route to Cubium as prerequisites to Cubium's planet discovery. Incompatible with Any Planet Start. Will crash on startup if Any Planet Start is installed and this setting is enabled.
cubium-and-more-science-pack-reorganization=Reorganize the science packs in the same order as their original counterparts are sorted in a new subgroup within the Cubium tab. If the Science Group mod is installed, the cubic Nauvis science packs will be split into a separate subgroup for better organization.
